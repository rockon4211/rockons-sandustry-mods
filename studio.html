<title>Sandustry Material Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#101318; --panel:#1a1f27; --panel2:#151a21; --line:#2e3642; --line2:#3d4756;
  --text:#d7dde6; --dim:#8a94a3; --faint:#5b6472; --accent:#ffd75e;
  --heat:#ff9a3d; --touch:#6fc3ff; --mine:#c9964a; --cycle:#8fe08f;
  --disp:"Chakra Petch","IBM Plex Sans",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.5 var(--body);overflow:hidden}
#app{display:grid;grid-template-rows:52px 1fr;height:100vh}
header{display:flex;align-items:center;gap:16px;padding:0 18px;background:var(--panel2);border-bottom:1px solid var(--line)}
header h1{font:600 17px var(--disp);letter-spacing:.04em;margin:0;color:var(--text)}
header h1 b{color:var(--accent);font-weight:700}
.phase{font:500 10px var(--mono);color:var(--ground);background:var(--accent);padding:2px 8px;border-radius:3px;letter-spacing:.08em}
.stats{margin-left:auto;display:flex;gap:18px;font:12px var(--mono);color:var(--dim)}
.stats b{color:var(--text)}
#main{display:grid;grid-template-columns:236px 1fr;min-height:0}
/* ---------- sidebar ---------- */
#side{background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side input{margin:10px;padding:7px 10px;background:var(--ground);border:1px solid var(--line);border-radius:4px;color:var(--text);font:12px var(--mono)}
#side input:focus{outline:none;border-color:var(--accent)}
#list{overflow-y:auto;flex:1;padding:0 6px 10px}
.grp{font:600 10px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:12px 8px 4px}
.mat{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12.5px}
.mat:hover{background:var(--panel)}
.mat.sel{background:var(--panel);outline:1px solid var(--accent)}
.sw{width:11px;height:11px;border-radius:2px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.mat .d{margin-left:auto;font:11px var(--mono);color:var(--faint)}
.mat .act{margin-left:auto;display:flex;gap:4px}
.mat .act button{font:10px var(--mono);background:none;border:1px solid var(--line2);border-radius:3px;color:var(--dim);cursor:pointer;padding:1px 6px}
.mat .act button:hover{color:var(--accent);border-color:var(--accent)}
.mat .act button.x:hover{color:#ff8a8a;border-color:#ff8a8a}
.mat.ghost{opacity:.6}
#legend{border-top:1px solid var(--line);padding:10px 14px 12px;font-size:11px;color:var(--dim)}
#legend .lg{display:flex;align-items:center;gap:8px;margin-top:5px}
#legend .bar{width:22px;height:0;border-top:2px solid;flex-shrink:0}
#legend .dash{border-top-style:dashed}
/* ---------- canvas ---------- */
#wrap{position:relative;min-width:0;min-height:0;background:
  radial-gradient(circle at 30% 20%, #131822 0%, var(--ground) 55%)}
#wrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);
  background-size:26px 26px}
svg{width:100%;height:100%;display:block;cursor:grab}
svg.panning{cursor:grabbing}
.edge{fill:none;stroke-width:1.6;opacity:.75}
.edge.approx{stroke-dasharray:5 4;opacity:.55}
.edge.hl{opacity:1;stroke-width:2.4}
.elabel{font:500 9.5px var(--mono);fill:var(--dim);pointer-events:none}
.node{cursor:pointer}
.node rect.box{fill:var(--panel);stroke:var(--line2);stroke-width:1;rx:5}
.node.sel rect.box{stroke:var(--accent);stroke-width:1.6}
.node text.nm{font:600 11.5px var(--disp);fill:var(--text);pointer-events:none}
.node text.mt{font:9px var(--mono);fill:var(--dim);pointer-events:none}
.node.terrain rect.box{fill:#171a15;stroke:#4a4433;rx:1}
.node.machine rect.box{fill:#20242e;stroke:#4a5568;rx:10}
.node.machine text.nm{fill:var(--accent)}
/* ---------- inspector ---------- */
#insp{position:absolute;top:14px;right:14px;width:264px;max-height:calc(100% - 28px);overflow-y:auto;
  background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:14px 16px;display:none;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
#insp.open{display:block}
#insp h2{font:700 15px var(--disp);margin:0 0 2px;display:flex;align-items:center;gap:8px}
#insp .id{font:11px var(--mono);color:var(--faint);margin-bottom:10px}
.chip{display:inline-block;font:500 10px var(--mono);padding:1px 7px;border-radius:9px;border:1px solid var(--line2);color:var(--dim)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--panel2);font-size:12.5px}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dbar{position:relative;height:6px;background:var(--ground);border-radius:3px;margin:8px 0 2px}
.dbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.dticks{display:flex;justify-content:space-between;font:9px var(--mono);color:var(--faint)}
#insp h3{font:600 10px var(--disp);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:14px 0 4px}
.proc{font-size:12px;padding:5px 0;border-bottom:1px solid var(--panel2);cursor:pointer}
.proc:hover{color:var(--accent)}
.proc .via{font:10px var(--mono);color:var(--dim)}
.conf{font:500 9px var(--mono);padding:1px 5px;border-radius:3px;margin-left:5px}
.conf.v{background:rgba(143,224,143,.14);color:var(--cycle)}
.conf.a{background:rgba(255,215,94,.1);color:var(--accent)}
.note{font-size:12px;color:var(--dim);line-height:1.55;margin-top:6px}
#insp .close{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--faint);cursor:pointer;font:14px var(--mono)}
#insp .close:hover{color:var(--text)}
#hint{position:absolute;left:14px;bottom:12px;font:11px var(--mono);color:var(--faint);pointer-events:none}
button:focus-visible,.mat:focus-visible{outline:2px solid var(--accent)}
/* ---------- editor ---------- */
.tbtn{font:600 11px var(--disp);letter-spacing:.06em;background:var(--panel);border:1px solid var(--line2);
  color:var(--text);border-radius:5px;padding:6px 12px;cursor:pointer}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);color:var(--ground);border-color:var(--accent)}
.edge.dis{opacity:.15;stroke-dasharray:2 5}
.vlink{fill:none;stroke:#4a5568;stroke-width:1;stroke-dasharray:3 4;opacity:.3;pointer-events:none}
.vlink.hl{opacity:.95;stroke:var(--accent);stroke-width:1.4}
.slot{fill:transparent;stroke:#2e3642;stroke-dasharray:3 4;opacity:.28;pointer-events:none}
.slot.free{pointer-events:all;cursor:pointer;opacity:.6;stroke:#5b6472}
.slot.free:hover{stroke:var(--accent);opacity:1;fill:rgba(255,215,94,.07)}
.node.carrying rect.box{stroke:var(--touch);stroke-width:2.2;stroke-dasharray:4 3}
.edge.custom{stroke-width:2}
.node.linksrc rect.box{stroke:var(--touch);stroke-width:2}
.frm label{display:block;font:600 9.5px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:10px 0 3px}
.frm input[type=text],.frm input[type=number],.frm select,.frm textarea{width:100%;padding:6px 8px;background:var(--ground);
  border:1px solid var(--line);border-radius:4px;color:var(--text);font:12px var(--mono)}
.frm input:focus,.frm select:focus,.frm textarea:focus{outline:none;border-color:var(--accent)}
.frm textarea{resize:vertical;min-height:44px;font-family:var(--body)}
.frm input[type=color]{width:100%;height:30px;padding:2px;background:var(--ground);border:1px solid var(--line);border-radius:4px;cursor:pointer}
.frm .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frm .chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);margin-top:8px;cursor:pointer}
.btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;font:600 11px var(--disp);letter-spacing:.05em;padding:7px 0;border-radius:5px;cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--ground);border-color:var(--accent)}
.btn.warn{color:#ff8a8a}
.btn.warn:hover{border-color:#ff8a8a}
.conf.c{background:rgba(111,195,255,.12);color:var(--touch)}
.tag{display:inline-block;font:500 9px var(--mono);padding:1px 6px;border-radius:3px;margin-left:6px;background:rgba(255,215,94,.12);color:var(--accent)}
.savedflash{color:var(--cycle);font:600 10px var(--mono);margin-left:8px;animation:sfade 1.8s forwards}
@keyframes sfade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: no-preference){
  .node{transition:opacity .15s}
}
</style>
<div id="app">
<header>
  <h1>SANDUSTRY <b>MATERIAL STUDIO</b></h1>
  <span style="display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden">
    <button class="tbtn" id="tabVan" style="border:none;border-radius:0">VANILLA</button>
    <button class="tbtn on" id="tabMod" style="border:none;border-radius:0">MOD</button>
    <button class="tbtn" id="tabTech" style="border:none;border-radius:0">TECH</button>
  </span>
  <button class="tbtn" id="newMatBtn">+ MATERIAL</button>
  <button class="tbtn" id="linkBtn">⇢ DRAW PROCESS</button>
  <div class="stats"><span><b id="stEl">0</b> materials</span><span><b id="stPr">0</b> processes</span><span><b id="stM">0</b> machines</span></div>
</header>
<div id="main">
  <div id="side">
    <input id="q" type="text" placeholder="search materials…" spellcheck="false">
    <div id="list"></div>
    <div id="legend">
      <div style="font:600 10px var(--disp);letter-spacing:.13em;color:var(--faint)">PROCESS TYPES</div>
      <div class="lg"><span class="bar" style="border-color:var(--heat)"></span>machine / heat</div>
      <div class="lg"><span class="bar" style="border-color:var(--touch)"></span>touch reaction</div>
      <div class="lg"><span class="bar" style="border-color:var(--mine)"></span>mining drop</div>
      <div class="lg"><span class="bar" style="border-color:var(--cycle)"></span>growth / cycle</div>
      <div class="lg"><span class="bar dash" style="border-color:var(--dim)"></span>dashed = approximate</div>
    </div>
  </div>
  <div id="wrap">
    <svg id="cv"><defs>
      <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="context-stroke"/></marker>
    </defs><g id="world"></g></svg>
    <div id="insp"><button class="close" id="inspClose">✕</button><div id="inspBody"></div></div>
    <div id="hint">drag nodes · drag background to pan · scroll to zoom · click for details</div>
  </div>
</div>
</div>

const TERRAINS = [
{id:"t_dune",n:"Dune",g:"Desert",hp:1,x:1530,y:150},
{id:"t_limestone",n:"Limestone",g:"Desert",hp:40,x:1530,y:260},

// kind: heat | touch | mine | cycle ; conf: v(erified in code) | a(pprox)
const VPROCS = [
{f:"wetSand",t:"gold",via:"m_shaker",k:"heat",conf:"v",lbl:"gold 25%",note:"Wet Sand placed on a Shaker refines automatically; Gold drops downward out of it. Rate: ~25% of grains yield gold in normal play (the 50% figure only applies during the RefineWetSand tutorial step)."},

{f:"seedling",t:"petalium",k:"cycle",conf:"a",lbl:"up to 4 petals",note:"The Planter Box tends the growth chain. A grown seed yields up to 4 petals (one per empty side), and each petal harvests to one Amethelis/Petalium — this is the chain's second multiplier after the Shaker. The spent seed cell becomes GoldSoil, which digs to gold."},

// Older saves drew machine recipes as two arrows (in + out) — merge them into one via-edge.
function migrateCustom(){
  const machineIds=new Set(MACHINES.map(m=>m.id));
  const ins=CUSTOM.procs.filter(p=>machineIds.has(p.t)&&p.k==='heat');
  let changed=false;
  for(const a of ins){
    const b=CUSTOM.procs.find(o=>o.f===a.t&&o.k==='heat'&&machineIds.has(o.f));
    if(!b)continue;
    CUSTOM.seq=(CUSTOM.seq||0)+1;
    CUSTOM.procs.push({key:'c'+CUSTOM.seq,f:a.f,t:b.t,k:'heat',via:a.t,lbl:a.lbl||b.lbl||'',note:a.note||b.note||''});
    CUSTOM.procs=CUSTOM.procs.filter(p=>p!==a&&p!==b);
    changed=true;
  }
  // Prune untouched "New Material" phantoms left by the old create-first flow.
  for(const id in CUSTOM.mats){
    const m=CUSTOM.mats[id];
    if(m.n==='New Material'&&!CUSTOM.procs.some(p=>p.f===id||p.t===id)){delete CUSTOM.mats[id];changed=true;}
  }
  if(changed)saveCustom();
}

    const o=modView?CUSTOM.over[m.id]:null; nodes[m.id]={...m,...(o||{}),type:'mat',modded:!!o}});

  if(modView) PROCS=PROCS.concat(CUSTOM.procs.map(p=>({...p,src:'c',conf:'c'})));
  // Parallel edges (same from -> same to) fan out instead of stacking:
  // each gets a bigger bend so curves and labels never overlap.
  {const seen={}; PROCS.forEach(p=>{const k=p.f+'|'+p.t; p._par=seen[k]||0; seen[k]=p._par+1;});}

const KCOL={heat:'var(--heat)',touch:'var(--touch)',mine:'var(--mine)',cycle:'var(--cycle)'};

function dim(n){return n.type==='machine'?{w:MW,h:MH}:{w:NW,h:NH}}

function edgePath(p){
  const a=nodes[p.f], b=nodes[p.t]; if(!a||!b) return null;
  const da=dim(a), db=dim(b);
  const ax=a.x+da.w/2, ay=a.y+da.h/2, bx=b.x+db.w/2, by=b.y+db.h/2;
  const dx=bx-ax, dy=by-ay, len=Math.max(1,Math.hypot(dx,dy));
  const ux=dx/len, uy=dy/len;
  const sx=ax+ux*(da.w/2+4)*(Math.abs(ux)>Math.abs(uy)?1:Math.abs(uy/Math.max(.01,Math.abs(ux)+Math.abs(uy)))), sy=ay+uy*(da.h/2+4);
  const ex=bx-ux*(db.w/2+8), ey=by-uy*(db.h/2+8);
  const mx=(sx+ex)/2, my=(sy+ey)/2, bend=Math.min(40,len*.15)+((p._par||0)*30);
  const cx=mx-uy*bend, cy=my+ux*bend;
  return {d:`M${sx} ${sy}Q${cx} ${cy} ${ex} ${ey}`,lx:(sx+2*cx+ex)/4,ly:(sy+2*cy+ey)/4};
}

      const m=nodes[p.via], md=dim(m);
      vl=el('path',{class:'vlink',d:`M${m.x+md.w/2} ${m.y+md.h/2}L${g.lx} ${g.ly+9}`});

function compilesTo(p){
  if(p.dis)return 'disabled — stripped from the exported mod';
  if(p.k==='heat'&&p.via==='m_shaker')return 'a real Shaker recipe (outputs drop below / get thrown above)';
  if(p.k==='heat'&&p.via==='m_smelter')return 'a Smelter recipe (converts on the machine face)';
  if(p.k==='heat'&&p.via==='m_dryer')return 'a Steam Dryer recipe';
  if(p.k==='heat'&&p.via)return 'not compilable yet — no mod recipe registry found for that machine';
  if(p.k==='touch')return 'a worker touch reaction — the partner grain is consumed';
  if(p.k==='mine'&&p.f==='t_dune')return 'a terrain output swap (broken dune cells spawn the target)';
  if(p.k==='mine')return 'vanilla terrain behaviour (output table)';
  if(p.k==='cycle')return 'engine-internal timing — not compilable yet';
  return 'not compilable yet';
}

  if(p.note)h+=`<div class="note">${esc(p.note)}</div>`;
  if((p.via==='m_smelter'||p.via==='m_dryer')&&fa&&fb&&fa.type==='mat'&&fb.type==='mat'&&fb.d>=fa.d)

  }

  body.innerHTML=h; insp.classList.add('open');
}

function editMat(id){const n=nodes[id]; if(!n)return; body.innerHTML=matForm(n,false); insp.classList.add('open');}
function saveMat(id,isNew){
  const g=x=>document.getElementById(x);
  const v={n:g('f_n').value.trim()||'Unnamed',m:g('f_m').value,d:Math.max(1,+g('f_d').value||150),
    c:parseInt(g('f_c').value.slice(1),16),g:g('f_g').value.trim()||'Custom'};
  const fl={grabbable:g('f_gr').checked,transportable:g('f_tr').checked};
  if(!(fl.grabbable&&fl.transportable))v.fl=fl;
  if(isNew){
    let nid=(g('f_id').value.trim()||id).replace(/[^a-zA-Z0-9_]/g,'')||('custom'+((CUSTOM.seq||0)+1));
    if(nodes[nid]){g('f_id').style.borderColor='#ff8a8a';g('f_id').value=nid+'_2';return;}
    CUSTOM.seq=(CUSTOM.seq||0)+1;
    CUSTOM.mats[nid]={...v,id:nid,x:draftMat?draftMat.x:100,y:draftMat?draftMat.y:100};
    draftMat=null;
    saveCustom(); rebuild(); select(nid,true);
    return;
  }
  const n=nodes[id];
  if(!n)return; // the material was removed between the edit and this blur
  if(n.custom){
    CUSTOM.mats[id]={...CUSTOM.mats[id],...v,id,x:n.x,y:n.y};
    if(!v.fl)delete CUSTOM.mats[id].fl;
    saveCustom(); rebuild(); select(id,true);
  } else {
    // vanilla override — store only fields that differ
    const base=MATS.find(m=>m.id===id), o={};
    for(const k of ['n','m','d','c','g'])if(v[k]!==base[k])o[k]=v[k];
    const baseFl=base.fl||{grabbable:true,transportable:true};
    if(fl.grabbable!==(baseFl.grabbable!==false)||fl.transportable!==(baseFl.transportable!==false))o.fl=fl;
    if(Object.keys(o).length)CUSTOM.over[id]=o; else delete CUSTOM.over[id];
    saveCustom(); rebuild(); select(id,true);
  }
}
function revertMat(id){delete CUSTOM.over[id]; saveCustom(); rebuild(); select(id);}
function removeMat(id){
  const n=nodes[id]; if(!n||n.type!=='mat')return;
  if(n.custom){
    CUSTOM.trash=CUSTOM.trash||{};

    delete CUSTOM.mats[id];
    CUSTOM.procs=CUSTOM.procs.filter(p=>!(p.f===id||p.t===id||p.partner===id));
  } else {
    CUSTOM.hidden=CUSTOM.hidden||[];
    if(!CUSTOM.hidden.includes(id))CUSTOM.hidden.push(id);
  }
  sel=null; insp.classList.remove('open');
  saveCustom(); rebuild();
}
function restoreMat(id){

    CUSTOM.procs=CUSTOM.procs.concat(CUSTOM.trash[id].procs||[]);
    delete CUSTOM.trash[id];

rill","r":12,"c":5,"n":"Drill","cost":2500},{"id":"Smelter","r":13,"c":1,"n":"Smelter","cost":3},{"id":"energySiphon","r":13,"c":3,"n":"Energy Siphon"},{"id":"fluxEmanator","r":13,"c":8,"n":"Flux Emanator"},{"id":"copperMold","r":14,"c":2,"n":"Copper Mold"},{"id":"voidOrb","r":14,"c":7,"n":"Void Orb"},{"id":"electricityConnector","r":15,"c":1,"n":"Electricity Connector"},{"id":"SteamTurbine","r":15,"c":3,"n":"Steam Turbine","cost":3},{"id":"MiningLaser","r":16,"c":5,"n":"Mining Laser","cost":5},{"id":"Recall","r":16,"c":6,"n":"Recall","cost":4},{"id":"Locator","r":16,"c":8,"n":"Locator","cost":3},{"id":"aurixiteCrystallizer","r":17,"c":4,"n":"Aurixite Crystallizer"},{"id":"swarmConsole","r":19,"c":4,"n":"Swarm Console"},{"id":"entityCount1","r":20,"c":3,"n":"Swarm Capacity I"},{"id":"volcanizer","r":20,"c":5,"n":"Volcanizer"},{"id":"entityCount2","r":21,"c":2,"n":"Swarm Capacity II"},{"id":"spiralSwarm","r":21,"c":3,"n":"Spiral Swarm"},{"id":"prismiteWell","r":21,"c":4,"n":"Prismite Well"},{"id":"ImplosionGun","r":21,"c":6,"n":"Implosion Gun","cost":1},{"id":"swarmZoning","r":22,"c":2,"n":"Swarm Zoning"},{"id":"swarmScouts","r":22,"c":3,"n":"Swarm Strikers"},{"id":"prismalineWell","r":23,"c":4,"n":"Prismaline Well"}],"edges":[["Shaker","Conveyors"],["GoldBattery","snowmaker"],["thermalRelay","burnerBelt"],["aurixiteCrystallizer","swarmConsole"],["Conveyors","Filters"],["Flamethrower","KineticPress"],["entityCount1","spiralSwarm"],["entityCount1","entityCount2"],["entityCount2","swarmZoning"],["spiralSwarm","swarmScouts"],["prismiteWell","prismalineWell"],["volcanizer","ImplosionGun"],["Flamethrower","Gun"],["PlanterBox","Thermo"],["KineticPress","PlanterBox"],["Shaker","Hover"],["Hover","Flamethrower"],["Hover","Map"],["Map","FlareGun"],["voidOrb","Recall"],["voidOrb","fluxEmanator"],["voidOrb","Locator"],["Conveyors","ConveyorsMk2"],["thermalRelay","heatCannon"],["KineticPress","thermalRelay"],["PlanterBox","Pipes"],["Gun","Rocket"],["Rocket","Drill"],["Drill","MiningLaser"],["GoldBattery","Drill"],["GoldBattery","aurixiteCrystallizer"],["thermalRelay","Smelter"],["Smelter","copperMold"],["copperMold","energySiphon"],["copperMold","electricityConnector"],["copperMold","SteamTurbine"],["Map","voidOrb"],["Conveyors","QuantumPortal"],["Conveyors","ClearingFrame"],["ClearingFrame","kineticFieldEmitter"],["Conveyors","AdvancedFilters"],["Flamethrower","Sweeper"],["Gun","Diggers"],["Flamethrower","Cryoblaster"],["Map","Corraller"],["Gun","Vacuum"],["Map","reconDrone"],["ConveyorsMk2","Haulers"],["GoldBattery","copperMold"],["Hover","SprintBoost"],["FlareGun","StaticLights"],["StaticLights","flashlight"],["Map","Heatmap"],["Thermo","GoldBattery"],["conveyorRightMk2","launcherUpMk2"],["thermodryer","thermofroster"]]};
// Our mod's nodes: draggable, re-parentable; defaults match the compiled mod.
TECHDATA.nodes.forEach(n=>{if(n.n.indexOf('{')>=0){const x=n.id.replace(/(?!^)([A-Z])/g,' $1');n.n=x[0].toUpperCase()+x.slice(1);}});
const MYTECH=[
 {id:"brandonModTools",n:"Mod Tools",parent:"Shaker",r:0,c:5,cost:0},
 {id:"brandonManufacturing",n:"Manufacturing",parent:"Smelter",r:13,c:0,cost:250},
 {id:"brandonGlassTech",n:"Glass",parent:"brandonManufacturing",r:14,c:0,cost:500},
 {id:"brandonOilTech",n:"Oil",parent:"brandonManufacturing",r:13,c:-1,cost:250},
];
const TCW=118,TCH=96,TNW=96,TNH=64;
function myTech(){
 const t=CUSTOM.tech||{moves:{},parents:{}};
 return MYTECH.map(m=>({...m,
   r:(t.moves[m.id]&&t.moves[m.id].r!==undefined)?t.moves[m.id].r:m.r,
   c:(t.moves[m.id]&&t.moves[m.id].c!==undefined)?t.moves[m.id].c:m.c,
   parent:t.parents[m.id]||m.parent}));
}
function techOccupied(r,c,exceptId){
 if(TECHDATA.nodes.some(n=>n.r===r&&n.c===c))return true;
 return myTech().some(m=>m.id!==exceptId&&m.r===r&&m.c===c);
}
let techSel=null;
function techDraw(){
 world.innerHTML=''; edgeEls=[]; nodeEls={};
 const mine=myTech();
 const all={}; TECHDATA.nodes.forEach(n=>all[n.id]=n); mine.forEach(m=>all[m.id]=m);
 const cx=n=>n.c*TCW+TNW/2, cy=n=>n.r*TCH+TNH/2;
 // the grid itself: one slot outline per possible node position
 const MAXR=31,MINC=-1,MAXC=10;
 for(let r=0;r<MAXR;r++)for(let c=MINC;c<MAXC;c++){
   const occ=techOccupied(r,c,null);
   const free=!occ&&!!techCarry;
   const cell=el('rect',{class:'slot'+(free?' free':''),x:c*TCW,y:r*TCH,width:TNW,height:TNH,rx:8});
   if(free){const rr=r,cc=c;cell.addEventListener('click',ev=>{ev.stopPropagation();
     CUSTOM.tech=CUSTOM.tech||{moves:{},parents:{}};
     CUSTOM.tech.moves[techCarry]={r:rr,c:cc};
     const placed=techCarry; techCarry=null;
     saveCustom(); techDraw(); techSelect(placed); techToast('Placed');});}
   world.appendChild(cell);
 }
 const drawEdge=(f,t,mineEdge)=>{
   const a=all[f],b=all[t]; if(!a||!b)return;
   const p=el('path',{class:'vlink',d:`M${cx(a)} ${cy(a)}L${cx(b)} ${cy(b)}`,
     style:mineEdge?'stroke:var(--accent);opacity:.8;stroke-dasharray:none;stroke-width:1.6':'opacity:.5;stroke-dasharray:none'});
   world.appendChild(p);
 };
 TECHDATA.edges.forEach(e=>drawEdge(e[0],e[1],false));
 mine.forEach(m=>drawEdge(m.parent,m.id,true));
 for(const id in all){
   const n=all[id], isMine=MYTECH.some(m=>m.id===id);
   const g=el('g',{class:'node machine'+(isMine?' sel':''),transform:`translate(${n.c*TCW},${n.r*TCH})`});
   g.appendChild(el('rect',{class:'box',width:TNW,height:TNH,rx:8,
     style:isMine?'stroke:var(--accent)':(techSel===id?'stroke:var(--touch)':'')}));
   const t=el('text',{class:'nm',x:TNW/2,y:26,'text-anchor':'middle',style:'font-size:10px'+(isMine?'':';fill:var(--text)')});
   t.textContent=n.n.length>14?n.n.slice(0,13)+'…':n.n; g.appendChild(t);
   const sub=el('text',{class:'mt',x:TNW/2,y:44,'text-anchor':'middle'});
   sub.textContent=isMine?(n.cost?n.cost+'g · yours':'free · yours'):(n.cost!==undefined?n.cost+'g':''); g.appendChild(sub);
   if(isMine&&techCarry===id)g.classList.add('carrying');
   g.addEventListener('click',ev=>{ev.stopPropagation();
     if(isMine){ if(techCarry===id){techCarry=null;techToast('Put back down');} else {techCarry=id;techToast('Carrying '+n.n+' - click a free cell to place, Esc to cancel');} techDraw(); techSelect(id); }
     else techSelect(id);});
   world.appendChild(g); nodeEls[id]=g;
 }
 document.getElementById('stEl').textContent=TECHDATA.nodes.length+mine.length;
 document.getElementById('stPr').textContent=TECHDATA.edges.length+mine.length;
 document.getElementById('stM').textContent=mine.length;
}
let techCarry=null;
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&techCarry){techCarry=null;if(view==='tech')techDraw();techToast('Cancelled');}});
function techToast(m){const h=document.getElementById('hint');const old=h.textContent;h.textContent=m;setTimeout(()=>{h.textContent=old},2000);}
function safeName(id){const n=TECHDATA.nodes.find(x=>x.id===id)||MYTECH.find(x=>x.id===id);return n?n.n:id;}
function techSelect(id){
 techSel=id; techDraw();
 const mine=myTech().find(m=>m.id===id);
 const v=TECHDATA.nodes.find(n=>n.id===id);
 const n=mine||v; if(!n)return;
 let h=`<h2>${esc(n.n)}${mine?'<span class="tag">yours</span>':''}</h2>
   <div class="id">${mine?'your research node':'vanilla research node'} · grid ${n.r},${n.c}</div>`;
 if(n.cost!==undefined)h+=`<div class="kv"><span>cost</span><span>${n.cost} gold</span></div>`;
 if(mine){
   h+=`<div class="kv"><span>unlocks after</span><span>${esc(safeName(mine.parent))}</span></div>`;
   const opts=TECHDATA.nodes.map(x=>x.id).concat(MYTECH.map(x=>x.id)).filter(x=>x!==id);
   h+=`<div class="frm"><label>re-parent (which node unlocks this?)</label>
     <select id="tp_sel">${opts.map(o=>`<option value="${esc(o)}"${o===mine.parent?' selected':''}>${esc(safeName(o))}</option>`).join('')}</select>
     <div class="btns"><button class="btn pri" onmousedown="techSetParent('${esc(id)}')">Save parent</button>
     <button class="btn" onmousedown="techReset('${esc(id)}')">Reset node</button></div></div>
   <div class="note" style="color:var(--faint)">Click the node to pick it up, then click any free grid cell to place it (Esc cancels). Moves and re-parenting compile into the mod on the next export.</div>`;
 } else {
   const outs=TECHDATA.edges.filter(e=>e[0]===id).map(e=>safeName(e[1]));
   const ins=TECHDATA.edges.filter(e=>e[1]===id).map(e=>safeName(e[0]));
   if(ins.length)h+=`<div class="kv"><span>unlocked by</span><span style="text-align:right">${esc(ins.join(', '))}</span></div>`;
   if(outs.length)h+=`<div class="kv"><span>leads to</span><span style="text-align:right;max-width:150px">${esc(outs.join(', '))}</span></div>`;
   h+=`<div class="note" style="color:var(--faint)">Vanilla node - fixed in place. The engine offers no way to move vanilla tree positions from a mod (rewiring their gates is under investigation).</div>`;
 }
 body.innerHTML=h; insp.classList.add('open');
}
function techSetParent(id){
 const sel=document.getElementById('tp_sel'); if(!sel)return;
 CUSTOM.tech=CUSTOM.tech||{moves:{},parents:{}};
 CUSTOM.tech.parents[id]=sel.value;
 saveCustom(); techDraw(); techSelect(id);
}
function techReset(id){
 CUSTOM.tech=CUSTOM.tech||{moves:{},parents:{}};
 delete CUSTOM.tech.moves[id]; delete CUSTOM.tech.parents[id];
 saveCustom(); techDraw(); techSelect(id);
}
window.techSelect=techSelect;window.techSetParent=techSetParent;window.techReset=techReset;
// ---------- vanilla / mod views ----------
function setView(v){
  view=v; try{localStorage.setItem('sms.view',v)}catch(e){}
  document.getElementById('tabVan').classList.toggle('on',v==='vanilla');
  document.getElementById('tabMod').classList.toggle('on',v==='mod');
  document.getElementById('tabTech').classList.toggle('on',v==='tech');
  document.getElementById('newMatBtn').hidden=v!=='mod';
  document.getElementById('linkBtn').hidden=v!=='mod';
  setLinkMode(false); sel=null; techSel=null; insp.classList.remove('open');
  if(v==='tech'){ techDraw(); document.getElementById('list').innerHTML='<div class="grp">Tech tree</div><div class="note" style="padding:4px 8px;font-size:11.5px;color:var(--dim)">The real in-game research tree. Gold-bordered nodes are yours: click to pick one up, click a free cell to place it, click again to put it down. Re-parent from the panel. Vanilla nodes are fixed by the engine.</div>'; }
  else { rebuild(); applySel(); }
}
document.getElementById('tabTech').onclick=()=>setView('tech');
document.getElementById('tabVan').onclick=()=>setView('vanilla');
document.getElementById('tabMod').onclick=()=>setView('mod');
window.addEventListener('keydown',e=>{if(e.key==='Escape'){setLinkMode(false); sel=null; applySel(); insp.classList.remove('open');}});
// ---------- sidebar ----------
const list=document.getElementById('list');
function buildList(filter){
  const f=(filter||'').toLowerCase(); list.innerHTML='';
  const groups={};
  Object.values(nodes).filter(n=>n.type==='mat').forEach(m=>{if(f&&!m.n.toLowerCase().includes(f)&&!m.id.toLowerCase().includes(f))return;(groups[m.g]=groups[m.g]||[]).push(m)});
  for(const g in groups){
    const gh=document.createElement('div');gh.className='grp';gh.textContent=g;list.appendChild(gh);
    groups[g].forEach(m=>{
      const r=document.createElement('div');r.className='mat';r.dataset.id=m.id;r.tabIndex=0;
      r.innerHTML=`<span class="sw" style="background:${hex(m.c)}"></span>${esc(m.n)}${m.custom||m.modded?' <span style="color:var(--accent)">•</span>':''}<span class="d">${m.d}</span>`;
      r.onclick=()=>{select(m.id);centerOn(m.id)};
      r.onkeydown=e=>{if(e.key==='Enter')r.onclick()};
      list.appendChild(r);
    });
  }
  if(view==='mod'){
    const trash=CUSTOM.trash||{}, hidden=CUSTOM.hidden||[];
    const items=Object.keys(trash).map(id=>({id,n:(trash[id].mat&&trash[id].mat.n)||id,c:(trash[id].mat&&trash[id].mat.c)||0x888888,custom:true}))
      .concat(hidden.map(id=>{const m=MATS.find(x=>x.id===id);return {id,n:m?m.n:id,c:m?m.c:0x888888,custom:false}}));
    if(items.length){
      const gh=document.createElement('div');gh.className='grp';gh.textContent='Unused ('+items.length+')';list.appendChild(gh);
      items.forEach(it=>{
        const r=document.createElement('div');r.className='mat ghost';
        r.innerHTML=`<span class="sw" style="background:${hex(it.c)}"></span><span style="text-decoration:line-through">${esc(it.n)}</span>
          <span class="act"><button onclick="restoreMat('${esc(it.id)}')" title="put it back, with its processes">restore</button>${it.custom?`<button class="x" onclick="destroyMat('${esc(it.id)}')" title="delete forever">✕</button>`:''}</span>`;
        list.appendChild(r);
      });
    }
  }
}
function centerOn(id){
  const n=nodes[id],r=svg.getBoundingClientRect(),d=dim(n);
  vx=r.width/2-(n.x+d.w/2)*vs; vy=r.height/2-(n.y+d.h/2)*vs; applyView();
}
document.getElementById('q').addEventListener('input',e=>buildList(e.target.value));
// ---------- boot ----------
migrateCustom(); setView(view); applyView();
select('sunsand'); centerOn('sunsand');
</script>
